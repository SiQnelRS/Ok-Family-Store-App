version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Base de datos relacional principal
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ok_family_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ok_family_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ok_family_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ok-family-net

  # ----------------------------------------------------------------------------
  # pgAdmin: Interfaz web de administración de base de datos (Opcional)
  # Acceso en: http://localhost:5050
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ok_family_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@okfamily.mx
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ok-family-net

volumes:
  pgdata:
    driver: local

networks:
  ok-family-net:
    driver: bridge
